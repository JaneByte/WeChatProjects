server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/freshtime?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 300000
      idle-timeout: 600000
      keepalive-time: 300000
      validation-timeout: 5000
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis-plus:

  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

mybatis:
  configuration:
    map-underscore-to-camel-case: true

wechat:
  miniprogram:
    app-id: ${WECHAT_MINIPROGRAM_APP_ID:}
    app-secret: ${WECHAT_MINIPROGRAM_APP_SECRET:}

app:
  upload-dir: uploads
  public-base-url: https://unashamed-cursor-drainable.ngrok-free.dev
  auth:
    admin-user-ids: 1
